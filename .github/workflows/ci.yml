# CI : vérifie chaque push et chaque PR. Ne déploie jamais en prod.
# Les PR obtiennent une prévisualisation (branche Pages pr-N) si la CI passe.
name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Syntaxe des fonctions
        run: for f in functions/api/*.js; do node --check "$f"; done
      - name: Fichiers attendus
        run: test -f public/index.html && test -f public/404.html
      - name: Aucun secret dans le site
        run: '! grep -rIl -E "CLOUDFLARE_API_TOKEN=|TG_TOKEN=|sk-[A-Za-z0-9]{20}" public functions'
  preview:
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 59ca249f7f4a9111c93523ab27d52a1f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          cp -R functions public/
          cd public && npx -y wrangler@4 pages deploy . --project-name kemet --branch "pr-${{ github.event.number }}" --commit-dirty=true --force
