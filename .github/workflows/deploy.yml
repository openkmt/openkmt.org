# Push sur main → déploiement de openkmt.org (Cloudflare Pages, projet `kemet`).
# Les PR obtiennent un déploiement de prévisualisation.
# Secret requis au niveau de l'organisation ou du dépôt : CLOUDFLARE_API_TOKEN (Pages Edit).
name: Déployer openkmt.org
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 59ca249f7f4a9111c93523ab27d52a1f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Déploiement
        run: |
          BRANCH=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'main' }}
          cp -R functions public/
          cd public && npx -y wrangler@4 pages deploy . --project-name kemet --branch "$BRANCH" --commit-dirty=true --force
