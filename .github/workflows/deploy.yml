# Déploiement PROD de openkmt.org — uniquement à la main (Actions → « Déployer en prod » → Run).
# Par défaut, déploie le SHA du dernier run CI vert sur main.
# On peut forcer un SHA précis, qui doit lui aussi avoir une CI verte (sert au rollback).
name: Déployer en prod
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA à déployer (vide = dernier build vert de main)"
        required: false
concurrency: { group: prod-deploy, cancel-in-progress: false }
permissions: { contents: read, actions: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 59ca249f7f4a9111c93523ab27d52a1f
    steps:
      - name: Choisir le SHA vert
        id: pick
        run: |
          set -euo pipefail
          WANT="${{ inputs.sha }}"
          GREEN=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
                  --status success --limit 100 --json headSha --jq '.[].headSha')
          if [ -z "$WANT" ]; then
            SHA=$(printf '%s\n' "$GREEN" | head -n1)
            [ -n "$SHA" ] || { echo "::error::Aucun build CI vert sur main"; exit 1; }
          else
            SHA=$(printf '%s\n' "$GREEN" | grep -m1 "^$WANT" || true)
            [ -n "$SHA" ] || { echo "::error::$WANT n'a pas de CI verte sur main"; exit 1; }
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Déploiement de \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with: { ref: "${{ steps.pick.outputs.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Déploiement Cloudflare Pages (prod)
        run: |
          cp -R functions public/
          cd public && npx -y wrangler@4 pages deploy . --project-name kemet --branch main \
            --commit-hash "${{ steps.pick.outputs.sha }}" --commit-message "prod ${{ steps.pick.outputs.sha }}" --commit-dirty=true --force
